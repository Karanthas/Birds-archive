# remote全vhost（含default）继承http级mTLS与CRL；没有免证书监听。
# reload会保留旧worker；5s关闭上界+禁TLS恢复供06-06-02撤销实测消费。
worker_processes 1;
worker_shutdown_timeout 5s;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size ${BIRDS_MAX_FILE_BYTES};
    client_body_buffer_size 16k;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 15s;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache off;
    ssl_session_tickets off;
    ssl_early_data off;
    ssl_certificate /run/birds-tls/server.crt;
    ssl_certificate_key /run/birds-tls/server.key;
    ssl_client_certificate /run/birds-tls/client-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_crl /run/birds-tls/clients.crl;
    add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
    add_header Pragma no-cache always;
    add_header X-Content-Type-Options nosniff always;
    proxy_hide_header Cache-Control;
    proxy_hide_header Pragma;
    proxy_hide_header X-Accel-Redirect;
    proxy_ignore_headers X-Accel-Redirect;
    proxy_cache off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_http_version 1.1;
    proxy_next_upstream off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    map $http_host $birds_valid_host {
        default 0;
        "${BIRDS_REMOTE_HOST}" 1;
        "${BIRDS_REMOTE_HOST}:443" 1;
    }
    server {
        listen 8443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 421;
    }
    server {
        listen 8443 ssl;
        server_name ${BIRDS_REMOTE_HOST};
        if ($ssl_server_name != "${BIRDS_REMOTE_HOST}") { return 421; }
        if ($birds_valid_host = 0) { return 421; }
        location = /delivery { return 403; }
        location ^~ /delivery/ { return 403; }
        location / { proxy_pass http://web:8000; }
    }
}
